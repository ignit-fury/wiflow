[package]
name = "wiflow-dictation"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[[bin]]
name = "wiflow-dictation"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
ringbuf = "0.4"
global-hotkey = "0.6"
hound = "3.5"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[dev-dependencies]
approx = "0.5"
