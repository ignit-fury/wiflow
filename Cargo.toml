[package]
name = "wiflow-dictation"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"

[[bin]]
name = "wiflow-dictation"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
ringbuf = "0.4"
hound = "3.5"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
webrtc-vad = "0.4"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.6"
enigo = "0.6"
whisper-rs = { version = "0.16", features = ["metal"] }
tray-icon = "0.24"
muda = "0.19"
winit = "0.30"
global-hotkey = "0.7"
open = "5"
egui = "0.31"
egui-winit = "0.31"
egui_glow = "0.31"
glow = "0.16"
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

[dev-dependencies]
approx = "0.5"
